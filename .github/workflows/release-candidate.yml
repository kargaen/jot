name: Release Candidate

on:
  push:
    branches:
      - dev
    paths-ignore:
      # Skill-library docs (.claude/skills/**) ship in the repo, not in the app.
      # A push that touches only skills should not spend a full RC build
      # (DB migrate + integration test + Windows installer + Android APK).
      # A mixed push (skills + real code) still triggers normally.
      - '.claude/skills/**'

permissions:
  contents: write

jobs:
  migrate-db:
    name: Apply Database Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Supabase migrations
        run: |
          npx supabase@latest link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --password ${{ secrets.SUPABASE_DB_PASSWORD }}
          npx supabase@latest db push --linked --yes --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy conduit edge function
        run: npx supabase@latest functions deploy conduit --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  integration-test:
    name: CRUD Integration Tests
    # Run AFTER migrations are applied: the tests exercise RLS on the live DB,
    # so the schema must be up to date first. (Previously migrate-db depended on
    # integration-test, so an RLS fix could never deploy while the test it was
    # meant to fix was failing.)
    needs: migrate-db
    runs-on: ubuntu-latest
    # Shared concurrency group across the build pipeline (test → build → android),
    # but NOT migrate-db: a newer dev push cancels whichever of these is still
    # running, while database migrations always finish.
    concurrency:
      group: rc-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run CRUD integration tests
        run: npx tsx scripts/ci-integration-test.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_TEST_USER_NAME: ${{ secrets.SUPABASE_TEST_USER_NAME }}
          SUPABASE_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_PASSWORD }}

  build-rc:
    name: Build and Publish Release Candidate
    needs: integration-test
    runs-on: windows-latest
    concurrency:
      group: rc-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Delete existing RC release and tag
        shell: bash
        run: gh release delete rc --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer and publish RC
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          tagName: rc
          releaseName: "Jot RC"
          releaseBody: "Latest release candidate — built from commit ${{ github.sha }}. Pre-release, not for production use."
          releaseDraft: false
          prerelease: true

  build-rc-android:
    name: Build Android APK
    needs: build-rc
    runs-on: ubuntu-latest
    concurrency:
      group: rc-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install NDK 27
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"
          echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # Persistent signing key: every RC must be signed with the SAME key or
      # Android refuses to update over the installed app. The keystore lives in
      # repo secrets; build.gradle.kts picks it up via key.properties.
      - name: Write release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > src-tauri/gen/android/keystore.jks
          cat > src-tauri/gen/android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      # Fail fast with a clear error if the secret was mistyped/truncated,
      # instead of a cryptic Gradle failure 5+ minutes into the build.
      - name: Verify release keystore
        run: |
          keytool -list -keystore src-tauri/gen/android/keystore.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            || { echo "::error::ANDROID_KEYSTORE_B64 does not decode to a valid keystore matching the alias/password secrets. Re-check the secret values."; exit 1; }

      # Strictly increasing versionCode per RC build so updates always install.
      # Base 1000002 = Tauri's derivation of version 1.0.2 (the last unbumped RC).
      - name: Bump Android versionCode
        run: |
          CODE=$((1000002 + ${{ github.run_number }}))
          echo "versionCode=$CODE"
          jq ".bundle.android.versionCode = $CODE" src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json

      - name: Build signed APK
        run: npm run tauri -- android build --apk
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload APK to RC release
        run: |
          APK=$(find src-tauri/gen/android -name "*.apk" -type f | head -1)
          echo "Uploading $APK"
          gh release upload rc "$APK" \
            --repo "${{ github.repository }}" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
